[package]
name = "proofpay-threshold-verifier"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
doctest = false

[dependencies]
# "alloc" required -- see contract/verifier/Cargo.toml's comment; same
# ultrahonk_soroban_verifier dependency, same global-allocator requirement.
soroban-sdk = { workspace = true, features = ["alloc"] }
ultrahonk_soroban_verifier = { git = "https://github.com/kalepail/rs-soroban-ultrahonk", rev = "fa1a26ca3fbdd736681208ddc84ed880ede20c81" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
